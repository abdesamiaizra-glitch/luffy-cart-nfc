async function saveProfile(){const s=await session();if(!s)return go('login');const p={username:cleanUser($("username").value),display_name:$("display_name").value.trim(),job_title:$("job_title").value.trim(),bio:$("bio").value.trim(),phone:$("phone").value.trim(),whatsapp:$("whatsapp").value.replace(/[^0-9]/g,''),email:$("profile_email").value.trim(),website:$("website").value.trim(),location:$("location").value.trim(),instagram:$("instagram").value.trim().replace(/^@/,''),tiktok:$("tiktok").value.trim().replace(/^@/,''),facebook:$("facebook").value.trim().replace(/^@/,''),linkedin:$("linkedin").value.trim().replace(/^@/,''),show_phone:$("show_phone").checked,show_whatsapp:$("show_whatsapp").checked,show_email:$("show_email").checked,show_website:$("show_website").checked,show_instagram:$("show_instagram").checked,show_tiktok:$("show_tiktok").checked,show_facebook:$("show_facebook").checked,show_linkedin:$("show_linkedin").checked,show_location:$("show_location").checked,is_published:$("published").checked};if(!p.username||p.username.length<3)return setMsg('اسم المستخدم غير صالح.');const {error}=await db.from('profiles').update(p).eq('id',s.user.id);if(error)return setMsg(error.message);setMsg('تم حفظ إعدادات الخصوصية والملف في Supabase ✓',true);setTimeout(()=>dashboard(),500)}

function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
async function shareCurrent(u){const url=publicUrl(u);if(navigator.share)return navigator.share({title:'LUFFY CART NFC',url});try{await navigator.clipboard.writeText(url);alert('تم نسخ الرابط')}catch{prompt('الرابط:',url)}}
function openProfileQr(u){const url=publicUrl(u);app.innerHTML=topbar(`<button class="btn" onclick="go('profile/${encodeURIComponent(u)}')">العودة</button>`)+`<div class="container"><div class="panel narrow center"><h2>QR Code</h2><div id="qrcode" class="qrbox"></div><button class="btn gold" onclick="downloadQr()">حفظ QR</button><p class="small">${esc(url)}</p></div></div>`;new QRCode($("qrcode"),{text:url,width:260,height:260,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H})}
function saveContact(p){const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${(p.display_name||p.username||'').replace(/\n/g,' ')}`];if(p.job_title)lines.push(`TITLE:${p.job_title}`);if(p.phone)lines.push(`TEL;TYPE=CELL:${p.phone}`);if(p.email)lines.push(`EMAIL:${p.email}`);if(p.website)lines.push(`URL:${p.website}`);if(p.location)lines.push(`ADR:;;${p.location}`);lines.push('END:VCARD');const blob=new Blob([lines.join('\n')],{type:'text/vcard;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(p.username||'contact')+'.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function page(t){app.innerHTML=topbar(`<button class="btn" onclick="go('')">الرئيسية</button>`)+`<div class="container"><div class="panel narrow center"><h2>LUFFY CART NFC</h2><p class="error">${esc(t)}</p></div></div>`}
async function logout(){await db.auth.signOut();go('')}
function showNfcQr(){const box=$("nfcQr");if(!box)return;box.innerHTML='';new QRCode(box,{text:$("nfcUrl")?.value||location.href,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}
async function copyNfcUrl(){const v=$("nfcUrl")?.value;if(!v)return;try{await navigator.clipboard.writeText(v);setMsg('تم نسخ رابط NFC ✓',true)}catch{setMsg('انسخ الرابط يدويًا من الحقل.')}}
function writeNfcGuide(){alert(`برمجة بطاقة NFC:

1) انسخ رابط بطاقة NFC.
2) افتح تطبيق كتابة NFC على هاتفك.
3) اختر كتابة رابط/URL.
4) الصق الرابط واكتب على البطاقة.
5) اختبر البطاقة بفتحها من هاتف آخر.

اكتب الرابط فقط داخل الشريحة، وليس رقم الهاتف أو البيانات الشخصية.`)}
async function route(){const path=location.pathname.replace(/^\/+|\/+$/g,'');const h=location.hash.slice(1);if(path&&path!=='index.html'&&!path.startsWith('dashboard')&&!path.startsWith('login')&&!path.startsWith('register'))return profile(decodeURIComponent(path));if(h.startsWith('profile/'))return profile(decodeURIComponent(h.slice(8)));if(h==='register')return auth('register');if(h==='login')return auth('login');if(h==='dashboard')return dashboard();if(path==='dashboard')return dashboard();return home()}
addEventListener('hashchange',route);addEventListener('popstate',route);route();
</script>
