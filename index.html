<style>
:root{--bg:#050505;--card:#101010;--card2:#151515;--line:#292929;--text:#fff;--muted:#a9a9a9;--gold:#d6b36a;--green:#3ddc84;--red:#ff7070;--blue:#77aaff;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b1a16 0,#070707 35%,#050505 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.container{width:min(1080px,calc(100% - 28px));margin:auto}.topbar{height:72px;border-bottom:1px solid #171717;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:rgba(5,5,5,.9);backdrop-filter:blur(16px);z-index:10}.logo{font-weight:950;letter-spacing:.06em;font-size:15px}.logo span{color:var(--gold)}.btn{border:1px solid var(--line);background:#141414;color:#fff;border-radius:14px;padding:11px 16px;font-weight:850;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:#444}.gold{background:var(--gold);color:#080808;border-color:var(--gold)}.danger{border-color:#472323;color:#ff8585}.ghost{background:transparent}.hero{padding:78px 0 45px;text-align:center}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.18em;font-weight:900}.hero h1{font-size:clamp(44px,11vw,88px);line-height:.94;margin:18px 0 20px;letter-spacing:-.055em}.hero p{max-width:680px;margin:auto;color:var(--muted);line-height:1.9;font-size:17px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}.section{padding:28px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature,.panel,.stat,.preview-card{background:linear-gradient(180deg,#121212,#0d0d0d);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.feature h3{margin:10px 0 7px}.feature p{color:var(--muted);line-height:1.7;margin:0}.icon{font-size:26px}.panel{max-width:850px;margin:28px auto}.panel.narrow{max-width:590px}.panel h2{margin-top:0;font-size:27px}.small{font-size:13px;color:#777}.muted{color:var(--muted)}.center{text-align:center}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field textarea{width:100%;padding:13px 14px;border-radius:13px;background:#080808;color:#fff;border:1px solid var(--line);outline:none}.field input:focus,.field textarea:focus{border-color:#666}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{min-height:22px;margin:5px 0 12px;font-weight:750}.error{color:var(--red)}.success{color:var(--green)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:3px}.tab{white-space:nowrap}.tab.active{border-color:var(--gold);color:var(--gold)}.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}.dash-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat .num{font-size:30px;font-weight:950}.stat .label{color:var(--muted);font-size:12px;margin-top:5px}.avatar-wrap{display:flex;align-items:center;gap:15px;margin-bottom:20px}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #444;background:#191919;display:grid;place-items:center;font-weight:950;font-size:26px}.avatar.big{width:116px;height:116px}.file-btn{display:inline-block}.hidden{display:none!important}.switch{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#0b0b0b;border-radius:14px;padding:13px 14px;margin:10px 0}.switch input{width:22px;height:22px}.profile-page{max-width:600px;margin:38px auto 70px;text-align:center}.profile-cover{padding:32px 20px 26px;background:linear-gradient(180deg,#111,#090909);border:1px solid var(--line);border-radius:30px}.profile-page h1{font-size:32px;margin:14px 0 4px}.job{color:var(--gold);font-weight:800}.bio{color:var(--muted);line-height:1.85;margin:13px auto;white-space:pre-wrap}.profile-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.links{display:grid;gap:10px;margin-top:18px}.link{padding:15px;border:1px solid var(--line);background:#121212;color:#fff;text-decoration:none;border-radius:15px;font-weight:850}.link.gold{background:var(--gold);color:#090909}.link.wa{border-color:#245b3a;background:#102419}.footer{color:#666;text-align:center;padding:40px 0;font-size:12px}.qrbox{background:#fff;border-radius:18px;padding:16px;width:max-content;margin:15px auto}.qrbox canvas,.qrbox img{display:block}.preview-card{max-width:420px;margin:0 auto;text-align:center}.preview-mini{border-radius:18px;background:#090909;padding:22px}.url-box{display:flex;gap:8px}.url-box input{flex:1}.notice{padding:12px 14px;border-radius:14px;background:#17130b;border:1px solid #3e331d;color:#e7d39e;line-height:1.7;margin:12px 0}.divider{height:1px;background:#1d1d1d;margin:20px 0}
@media(max-width:700px){.grid3,.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.topbar{height:64px}.hero{padding-top:58px}.hero h1{font-size:54px}.panel{padding:17px}.dash-head{align-items:flex-start;flex-direction:column}.url-box{flex-direction:column}}
</style>

<body><div id="app"></div>
<script>
const SUPABASE_URL="https://nueymxkqjedrdqopmpqp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_8K8sBerDRQC53tQIGcNVwA_yDNQIkkW";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const cleanUser=s=>String(s||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
function go(h=""){location.hash=h;window.scrollTo(0,0)}
function setMsg(t,ok=false){const el=$("msg");if(el){el.textContent=t;el.className="msg "+(ok?"success":"error")}}
async function session(){return (await db.auth.getSession()).data.session}
function topbar(right=''){return `<div class="topbar"><div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="logo">LUFFY <span>CART NFC</span></div><div>${right}</div></div></div>`}
function home(){app.innerHTML=topbar(`<button class="btn" onclick="go('login')">دخول</button>`)+`<div class="container"><section class="hero"><div class="eyebrow">NFC • QR • DIGITAL IDENTITY</div><h1>بطاقتك.<br>بنقرة واحدة.</h1><p>ملف أعمال رقمي احترافي، بطاقة NFC وQR، وروابطك كلها في صفحة واحدة. عدّل بياناتك من هاتفك دون تغيير البطاقة.</p><div class="actions"><button class="btn gold" onclick="go('register')">إنشاء حساب</button><button class="btn" onclick="go('login')">تسجيل الدخول</button></div></section><section class="section"><div class="grid3"><div class="feature"><div class="icon">🪪</div><h3>هوية رقمية</h3><p>صفحة شخصية تحمل اسمك وروابطك وبيانات الاتصال.</p></div><div class="feature"><div class="icon">📲</div><h3>NFC + QR</h3><p>رابط واحد يمكن وضعه داخل بطاقة NFC أو مشاركته عبر QR.</p></div><div class="feature"><div class="icon">📊</div><h3>إحصائيات</h3><p>تابع عدد مشاهدات ملفك من لوحة التحكم.</p></div></div></section></div>`+footer())}
function footer(){return `<div class="footer">LUFFY CART NFC — Digital Business Card</div>`}
function auth(type){const r=type==='register';app.innerHTML=topbar(`<button class="btn" onclick="go('')">الرئيسية</button>`)+`<div class="container"><div class="panel narrow"><h2>${r?'إنشاء حساب':'تسجيل الدخول'}</h2><div id="msg" class="msg"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل"></div>${r?`<div class="field"><label>اسم المستخدم</label><input id="username" placeholder="luffy905"><div class="small">سيصبح رابطك: /اسم-المستخدم</div></div>`:''}<button class="btn gold" style="width:100%" onclick="${r?'register()':'login()'}">${r?'إنشاء الحساب':'دخول'}</button><p class="center"><a href="#${r?'login':'register'}" style="color:var(--gold)">${r?'لدي حساب؟ تسجيل الدخول':'إنشاء حساب جديد'}</a></p></div></div>`}
async function register(){const email=$("email").value.trim(),password=$("password").value,username=cleanUser($("username").value);if(!email||password.length<6||username.length<3)return setMsg('أكمل البيانات. اسم المستخدم 3 أحرف على الأقل وكلمة المرور 6 أحرف.');const {data,error}=await db.auth.signUp({email,password});if(error)return setMsg(error.message);if(!data.user)return setMsg('تعذر إنشاء الحساب.');if(!data.session){setMsg('تم إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا، افتح بريدك ثم سجّل الدخول لإكمال الملف.',true);return;}const {error:e}=await db.from('profiles').insert({id:data.user.id,username,display_name:username,email});if(e){await db.auth.signOut();return setMsg(e.message)}go('dashboard')}
async function login(){const email=$("email").value.trim(),password=$("password").value;const {error}=await db.auth.signInWithPassword({email,password});if(error)return setMsg('بيانات تسجيل الدخول غير صحيحة أو الحساب يحتاج تأكيد البريد.');go('dashboard')}
async function getProfile(){const s=await session();if(!s)return null;const {data,error}=await db.from('profiles').select('*').eq('id',s.user.id).single();if(error)return {error};return {s,p:data}}
async function dashboard(){const x=await getProfile();if(!x)return go('login');if(x.error)return page('تعذر تحميل ملفك. شغّل SQL الخاص بـ V3 في Supabase.');const p=x.p;const {count}=await db.from('profile_views').select('*',{count:'exact',head:true}).eq('profile_id',p.id);app.innerHTML=topbar(`<button class="btn" onclick="go('profile/'+encodeURIComponent(p.username))">عرض الملف</button> <button class="btn danger" onclick="logout()">خروج</button>`)+`<div class="container"><div class="dash-head"><div><div class="eyebrow">CONTROL CENTER</div><h1 style="margin:5px 0">لوحة التحكم</h1><div class="small">@${esc(p.username)}</div></div></div><div class="stats"><div class="stat"><div class="num">${count??0}</div><div class="label">مشاهدة الملف</div></div><div class="stat"><div class="num">${p.is_published?'ON':'OFF'}</div><div class="label">حالة النشر</div></div><div class="stat"><div class="num">NFC</div><div class="label">الرابط جاهز للبطاقة</div></div></div><div class="panel"><div class="tabs"><button class="btn tab active">الملف</button><button class="btn tab" onclick="showQr('${esc(p.username)}')">QR</button></div><div id="msg" class="msg"></div><div class="avatar-wrap"><img id="avatarPreview" class="avatar" src="${esc(p.avatar_url||'')}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" ${p.avatar_url?'':'style="display:none"'}><div class="avatar" style="${p.avatar_url?'display:none':''}">${esc((p.display_name||p.username||'LC').slice(0,2).toUpperCase())}</div><div><strong>صورة الملف</strong><br><span class="small">JPG/PNG — يفضل صورة مربعة</span><br><label class="btn file-btn" for="avatarFile">اختيار صورة</label><input id="avatarFile" class="hidden" type="file" accept="image/*" onchange="uploadAvatar(this)"></div></div><div class="row"><div class="field"><label>اسم المستخدم</label><input id="username" value="${esc(p.username)}"></div><div class="field"><label>الاسم الظاهر</label><input id="display_name" value="${esc(p.display_name)}"></div></div><div class="row"><div class="field"><label>المسمى الوظيفي</label><input id="job_title" value="${esc(p.job_title)}" placeholder="Founder / Designer"></div><div class="field"><label>الموقع</label><input id="location" value="${esc(p.location)}" placeholder="Rabat, Morocco"></div></div><div class="field"><label>النبذة</label><textarea id="bio">${esc(p.bio)}</textarea></div><div class="row"><div class="field"><label>الهاتف</label><input id="phone" value="${esc(p.phone)}" placeholder="+212..."></div><div class="field"><label>WhatsApp</label><input id="whatsapp" value="${esc(p.whatsapp)}" placeholder="2126..."></div></div><div class="row"><div class="field"><label>البريد</label><input id="profile_email" value="${esc(p.email||x.s.user.email||'')}"></div><div class="field"><label>الموقع الإلكتروني</label><input id="website" value="${esc(p.website)}" placeholder="https://..."></div></div><div class="row"><div class="field"><label>Instagram</label><input id="instagram" value="${esc(p.instagram)}" placeholder="username"></div><div class="field"><label>TikTok</label><input id="tiktok" value="${esc(p.tiktok)}" placeholder="username"></div></div><div class="row"><div class="field"><label>Facebook</label><input id="facebook" value="${esc(p.facebook)}" placeholder="username"></div><div class="field"><label>LinkedIn</label><input id="linkedin" value="${esc(p.linkedin)}" placeholder="username"></div></div><div class="switch"><span><strong>نشر الملف</strong><br><span class="small">إذا أوقفته، لن يظهر للزوار.</span></span><input id="published" type="checkbox" ${p.is_published?'checked':''}></div><button class="btn gold" onclick="saveProfile()">حفظ التغييرات</button></div><div id="qrPanel" class="panel" style="display:none"></div><div class="panel"><h2>رابطك</h2><div class="url-box"><input id="publicUrl" readonly value="${esc(location.origin+'/'+p.username)}"><button class="btn" onclick="copyPublicUrl()">نسخ</button></div><div class="actions" style="justify-content:flex-start"><button class="btn" onclick="shareProfile()">مشاركة</button><button class="btn" onclick="go('profile/'+encodeURIComponent(p.username))">فتح الملف</button></div><div class="notice">ضع هذا الرابط داخل بطاقة NFC. عندما تغيّر بياناتك هنا، لا تحتاج إلى تغيير البطاقة.</div></div></div>`+footer()}
async function saveProfile(){const s=await session();if(!s)return go('login');const p={username:cleanUser($("username").value),display_name:$("display_name").value.trim(),job_title:$("job_title").value.trim(),bio:$("bio").value.trim(),phone:$("phone").value.trim(),whatsapp:$("whatsapp").value.replace(/[^0-9]/g,''),email:$("profile_email").value.trim(),website:$("website").value.trim(),location:$("location").value.trim(),instagram:$("instagram").value.trim().replace(/^@/,''),tiktok:$("tiktok").value.trim().replace(/^@/,''),facebook:$("facebook").value.trim().replace(/^@/,''),linkedin:$("linkedin").value.trim().replace(/^@/,''),is_published:$("published").checked};if(!p.username||p.username.length<3)return setMsg('اسم المستخدم غير صالح.');const {error}=await db.from('profiles').update(p).eq('id',s.user.id);if(error)return setMsg(error.message);setMsg('تم حفظ التغييرات في Supabase ✓',true);setTimeout(()=>dashboard(),500)}
async function uploadAvatar(input){const s=await session();const file=input.files?.[0];if(!s||!file)return;if(file.size>4*1024*1024)return setMsg('الصورة أكبر من 4MB.');if(!file.type.startsWith('image/'))return setMsg('اختر صورة.');setMsg('جاري رفع الصورة...');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${s.user.id}/avatar-${Date.now()}.${ext}`;const {error}=await db.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});if(error)return setMsg(error.message);const {data}=db.storage.from('avatars').getPublicUrl(path);const {error:e}=await db.from('profiles').update({avatar_url:data.publicUrl}).eq('id',s.user.id);if(e)return setMsg(e.message);setMsg('تم رفع الصورة ✓',true);setTimeout(()=>dashboard(),400)}
function publicUrl(username){return location.origin+'/'+username}
function showQr(username){const box=$("qrPanel");if(!box)return;box.style.display='block';box.innerHTML=`<div class="center"><h2>QR Code</h2><p class="small">امسح الكود لفتح ملف @${esc(username)}</p><div id="qrcode" class="qrbox"></div><button class="btn" onclick="downloadQr()">حفظ QR</button></div>`;new QRCode($("qrcode"),{text:publicUrl(username),width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}
function downloadQr(){const img=$("qrcode")?.querySelector('img');if(!img)return;const a=document.createElement('a');a.href=img.src;a.download='luffy-cart-nfc-qr.png';a.click()}
async function copyPublicUrl(){const v=$("publicUrl")?.value;if(!v)return;try{await navigator.clipboard.writeText(v);setMsg('تم نسخ الرابط ✓',true)}catch{prompt('انسخ الرابط:',v)}}
async function shareProfile(){const url=$("publicUrl")?.value;if(!url)return;if(navigator.share)await navigator.share({title:'LUFFY CART NFC',text:'ملفي الرقمي',url});else copyPublicUrl()}
async function profile(u){const {data:p,error}=await db.from('profiles').select('*').eq('username',u).eq('is_published',true).single();if(error)return page('الملف غير موجود أو غير منشور.');db.from('profile_views').insert({profile_id:p.id}).then(()=>{});const initials=esc((p.display_name||p.username||'LC').slice(0,2).toUpperCase());app.innerHTML=topbar(`<button class="btn" onclick="go('')">الرئيسية</button>`)+`<main class="container"><div class="profile-page"><div class="profile-cover"><img class="avatar big" src="${esc(p.avatar_url||'')}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" ${p.avatar_url?'':'style="display:none"'}><div class="avatar big" style="${p.avatar_url?'display:none':''};margin:0 auto">${initials}</div><h1>${esc(p.display_name||p.username)}</h1>${p.job_title?`<div class="job">${esc(p.job_title)}</div>`:''}<div class="bio">${esc(p.bio)}</div><div class="profile-actions"><button class="btn gold" onclick="saveContact(${JSON.stringify(p).replace(/</g,'\\u003c')})">حفظ جهة الاتصال</button><button class="btn" onclick="shareCurrent('${esc(p.username)}')">مشاركة</button><button class="btn" onclick="openProfileQr('${esc(p.username)}')">QR</button></div><div class="links">${p.phone?`<a class="link gold" href="tel:${esc(p.phone)}">📞 اتصال</a>`:''}${p.whatsapp?`<a class="link wa" target="_blank" rel="noopener" href="https://wa.me/${esc(p.whatsapp)}">💬 WhatsApp</a>`:''}${p.email?`<a class="link" href="mailto:${esc(p.email)}">✉️ Email</a>`:''}${p.website?`<a class="link" target="_blank" rel="noopener" href="${safeUrl(p.website)}">🌐 Website</a>`:''}${p.instagram?`<a class="link" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(p.instagram)}">◎ Instagram</a>`:''}${p.tiktok?`<a class="link" target="_blank" rel="noopener" href="https://tiktok.com/@${encodeURIComponent(p.tiktok)}">♪ TikTok</a>`:''}${p.facebook?`<a class="link" target="_blank" rel="noopener" href="https://facebook.com/${encodeURIComponent(p.facebook)}">f Facebook</a>`:''}${p.linkedin?`<a class="link" target="_blank" rel="noopener" href="https://linkedin.com/in/${encodeURIComponent(p.linkedin)}">in LinkedIn</a>`:''}${p.location?`<a class="link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.location)}">⌖ ${esc(p.location)}</a>`:''}</div><p class="small" style="margin-top:18px">@${esc(p.username)} · LUFFY CART NFC</p></div></div></main>`+footer()}
function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
async function shareCurrent(u){const url=publicUrl(u);if(navigator.share)return navigator.share({title:'LUFFY CART NFC',url});try{await navigator.clipboard.writeText(url);alert('تم نسخ الرابط')}catch{prompt('الرابط:',url)}}
function openProfileQr(u){const url=publicUrl(u);app.innerHTML=topbar(`<button class="btn" onclick="go('profile/${encodeURIComponent(u)}')">العودة</button>`)+`<div class="container"><div class="panel narrow center"><h2>QR Code</h2><div id="qrcode" class="qrbox"></div><button class="btn gold" onclick="downloadQr()">حفظ QR</button><p class="small">${esc(url)}</p></div></div>`;new QRCode($("qrcode"),{text:url,width:260,height:260,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H})}
function saveContact(p){const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${(p.display_name||p.username||'').replace(/\n/g,' ')}`];if(p.job_title)lines.push(`TITLE:${p.job_title}`);if(p.phone)lines.push(`TEL;TYPE=CELL:${p.phone}`);if(p.email)lines.push(`EMAIL:${p.email}`);if(p.website)lines.push(`URL:${p.website}`);if(p.location)lines.push(`ADR:;;${p.location}`);lines.push('END:VCARD');const blob=new Blob([lines.join('\n')],{type:'text/vcard;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(p.username||'contact')+'.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function page(t){app.innerHTML=topbar(`<button class="btn" onclick="go('')">الرئيسية</button>`)+`<div class="container"><div class="panel narrow center"><h2>LUFFY CART NFC</h2><p class="error">${esc(t)}</p></div></div>`}
async function logout(){await db.auth.signOut();go('')}
async function route(){const path=location.pathname.replace(/^\/+|\/+$/g,'');const h=location.hash.slice(1);if(path&&path!=='index.html'&&!path.startsWith('dashboard')&&!path.startsWith('login')&&!path.startsWith('register'))return profile(decodeURIComponent(path));if(h.startsWith('profile/'))return profile(decodeURIComponent(h.slice(8)));if(h==='register')return auth('register');if(h==='login')return auth('login');if(h==='dashboard')return dashboard();if(path==='dashboard')return dashboard();return home()}
addEventListener('hashchange',route);addEventListener('popstate',route);route();
</script>
</body></html>
